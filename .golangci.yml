linters-settings:
  goimports:
    local-prefixes: next-terminal

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

run:
  timeout: 5m

issues:
  # 原 run.skip-files 在新版 golangci-lint 中已迁移到 issues.exclude-files
  exclude-files:
    - test_ssh.go

  exclude-rules:
    # v1.3.9 遗留：仍在使用 io/ioutil、rand.Seed 等已弃用 API。
    # 迁移到 io/os、去掉 Seed 属于跨模块改动，不适合放进补丁版本。
    - linters:
        - staticcheck
      text: "SA1019"

    # errors.Is 参数顺序写反（正确写法是 errors.Is(err, target)）。
    # 修正会改变运行时行为，需单独评估回归，此处仅记录不阻塞构建。
    - linters:
        - staticcheck
      text: "SA1032"

    # term.go 中 window-change / 权限校验的空分支是待实现的 TODO 桩代码。
    - linters:
        - staticcheck
      text: "SA9003"
