name: Docker next-terminal Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  GHCR_next-terminal_Build:
    name: Docker next-terminal Build
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Private Actions Checkout
        uses: actions/checkout@v4

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: node Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web
        working-directory: web
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

          # 修复 ajv 版本错配：
          # ajv-keywords@5 把 ajv@^8 声明为 peerDependency，而 --legacy-peer-deps 会跳过
          # peer 安装，导致它解析到根目录 eslint 依赖的 ajv@6，webpack 构建时报
          # Cannot find module 'ajv/dist/compile/codegen'。
          # 这里把 schema-utils 自带的 ajv@8 复制一份到 ajv-keywords 的 node_modules 下。
          if [ -d node_modules/schema-utils/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            cp -r node_modules/schema-utils/node_modules/ajv node_modules/ajv-keywords/node_modules/
          elif [ -d node_modules/ajv-formats/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            cp -r node_modules/ajv-formats/node_modules/ajv node_modules/ajv-keywords/node_modules/
          else
            npm install --no-save --legacy-peer-deps --no-audit --no-fund ajv@^8.12.0
          fi
          echo "ajv-keywords 解析到的 ajv 版本: $(node -p "require('./node_modules/ajv-keywords/node_modules/ajv/package.json').version" 2>/dev/null || echo '根目录 ajv')"

          node node_modules/react-app-rewired/bin/index.js build

      # 使用内置 GITHUB_TOKEN 推送到 GHCR，无需配置任何 secret。
      # 如需同时推 DockerHub / 阿里云，见文件末尾注释。
      - name: Docker Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          # 只构建 amd64：堡垒机为 x86_64，ARM 平台在 QEMU 下编译极慢。
          # 需要多架构时改成 linux/amd64,linux/arm64,linux/arm/v7 即可。
          platforms: linux/amd64
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

