name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - be-*
      - dev
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v1.42.1（2021 年）无法解析本仓库的 Go 1.20 代码，
          # 会把 abi.Abi 的嵌入方法提升误报成 "api.Success undefined (typecheck)"。
          version: v1.62.2
          args: --timeout=10m
